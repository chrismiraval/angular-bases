<h4>Listado</h4>
<ul class="list-group">
  <li
    class="list-group-item list-group-item-success d-flex justify-content-between align-items-center"
    [ngClass]="{
      'list-group-item-primary': isFirst,
      'list-group-item-success': isLast,
    }"
    *ngFor="
      let character of charactersDbz;
      index as i;
      even as isEven;
      odd as isOdd;
      first as isFirst;
      last as isLast
    "
  >
    <div>
      {{ i + 1 }}. {{ character.name }} - <strong>Power:</strong>
      {{ character.power }}, Primero: {{ isFirst }}, Último: {{ isLast }}, Par:
      {{ isEven }}, Impar: {{ isOdd }}
    </div>

    <button class="btn btn-danger" (click)="deleteCharacter(character.id)">
      X
    </button>
  </li>
</ul>
